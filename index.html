<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDE6DA" />
    <script>
      // Apply the saved light/dark choice before the app loads, so Safari's bars
      // and the first paint already have the right colour (kept in sync by ThemeContext).
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#1A1714' : '#EDE6DA');
        } catch (e) {}
      })();
    </script>
    <title>Pizza Dough Calculator</title>
    <meta name="description" content="Räkna ut din pizzadeg: mjöl, vatten, salt och jäst för din jästid och temperatur. Planera pizzafesten och dela recept. / Calculate your pizza dough, plan a pizza party and share recipes." />
    <!-- Link previews (iMessage, WhatsApp, Facebook, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="pizzacalculator.se" />
    <meta property="og:title" content="Pizzadegsrecept · pizzacalculator.se" />
    <meta property="og:description" content="Mjöl, vatten, salt och jäst – uträknat för din jästid och temperatur. Öppna länken för hela receptet." />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
